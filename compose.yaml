services:
  una-chat:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.grafana
    environment:
      NODE_ENV: development
      PORT: "3000"
      AUTH0_TEST_MODE: ${UNA_CHAT_LAB_TEST_MODE:-false}
      OTEL_SERVICE_NAME: una-chat
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local,deployment.environment.name=local,service.instance.id=una-chat-docker
    init: true
    stop_grace_period: 15s
